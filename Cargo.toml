[package]
name = "git-commit-gen"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "git-commit-gen"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
dirs = "6.0.0"
inquire = "0.9.1"
reqwest = { version = "0.12.24", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.9.8"

[dev-dependencies]
dotenvy = "0.15.7"
tempfile = "3.23.0"
tokio-test = "0.4.4"
wiremock = "0.6.5"
